[package]
name = "flow-keychain"
description = "FlowFTP secure credential storage backed by the OS keychain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
flow-core = { path = "../core" }
# macOS Keychain via Security.framework. Other platforms need their native
# feature added when cross-platform support lands (see ROADMAP Phase 6).
keyring = { version = "3", features = ["apple-native"] }
