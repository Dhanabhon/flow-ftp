<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowFTP</title>
    <!--
      FOUC prevention: apply theme class BEFORE first paint. Runs before the
      app bundle so there's no light→dark flash. Source of truth is the same
      localStorage key the theme store reads at runtime (flowftp:theme).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('flowftp:theme');
          var sysDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') && sysDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-bg text-fg antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
