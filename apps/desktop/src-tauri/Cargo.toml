[package]
name = "flow-ftp"
version = "0.0.1"
description = "The most beautiful open-source FTP/SFTP client for macOS."
authors = ["Tom Dhanabhon"]
license = "MIT"
repository = "https://github.com/Dhanabhon/flow-ftp"
default-run = "flow-ftp"
edition = "2021"
rust-version = "1.77"

[lib]
name = "flow_ftp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Workspace crates — the application layer.
flow-core = { path = "../../../crates/core" }
flow-protocols = { path = "../../../crates/protocols" }
flow-keychain = { path = "../../../crates/keychain" }
flow-transfer = { path = "../../../crates/transfer" }
flow-sync = { path = "../../../crates/sync" }
# Local tree scanning for sync compare.
walkdir = "2"
async-trait = { workspace = true }
tokio = { workspace = true }

[features]
# By default do not enable custom protocol — it's opt-in and needs setup.
default = []
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
